 
 # Application
  spring.application.name=EnterpriseKnowledgeAssistant

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/ragdb
spring.datasource.username=YOUR_DATABASE_USERNAME
spring.datasource.password=YOUR_DATABASE_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# File Upload

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB


# Google Gemini Chat Model

spring.ai.google.genai.api-key=YOUR_API_KEY
spring.ai.google.genai.chat.options.model=gemini-2.5-flash
spring.ai.google.genai.project-id=YOUR_PROJECT_ID


# FIX: Embedding Specific Config (Duplicate the credentials here)
# Google Gemini Embedding Model
spring.ai.google.genai.embedding.api-key=YOUR_API_KEY
spring.ai.google.genai.embedding.project-id=YOUR_PROJECT_ID
spring.ai.google.genai.embedding.options.model=text-embedding-004




# PGVector
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=NONE


# Chat Memory
spring.ai.chat.memory.repository.jdbc.initialize-schema=always




